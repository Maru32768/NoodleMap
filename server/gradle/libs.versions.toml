# NOTE: pin/verify these versions at first build (`./gradlew dependencies`).
# Authored 2026-06; environment had no network to resolve latest.
[versions]
kotlin = "2.2.0"
ktor = "3.2.0"
sqldelight = "2.1.0"
fabrikt-plugin = "1.36.0"         # ch.acanda.gradle.fabrikt
kotlinx-serialization = "1.8.0"
kotlinx-coroutines = "1.10.0"
sqlite-jdbc = "3.50.1.0"
hikari = "6.2.1"
google-api-client = "2.7.2"      # com.google.api-client:google-api-client (GoogleIdTokenVerifier)
aws-sdk-kotlin = "1.3.0"         # aws.sdk.kotlin:s3
logback = "1.5.16"
junit = "5.10.5"        # aligned with Gradle 8.11's bundled JUnit Platform 1.10
kotest = "5.9.1"

[libraries]
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-auto-head-response = { module = "io.ktor:ktor-server-auto-head-response", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

sqldelight-jdbc-driver = { module = "app.cash.sqldelight:jdbc-driver", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }

google-api-client = { module = "com.google.api-client:google-api-client", version.ref = "google-api-client" }
aws-s3 = { module = "aws.sdk.kotlin:s3", version.ref = "aws-sdk-kotlin" }

logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
fabrikt = { id = "ch.acanda.gradle.fabrikt", version.ref = "fabrikt-plugin" }

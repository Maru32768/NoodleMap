# Ported from jev-lint's typescript/comment-describes-declaration, through CommandLib's Java port: the same question
# over Kotlin declarations.
id: noodlemap-comment-describes-declaration
language: Kotlin
kind: noul
subject: node
state: located
# 0.74, fitted 2026-10-23 (jev-1.13.0, 3 passes); CommandLib fitted the same cutoff for its Java port. The defects of
# fixtures/TagDirectory.kt answer 0.94-0.98 and its cleans at most 0.23. Real code does not separate as cleanly: on
# server/src/main/kotlin two wrong comments answered 0.65 (buildDataSource, said to build the NoodleMapDb) and 0.71-0.77
# (installStatusPages, said to turn everything but a DomainException into internal_error), while sound comments
# answered up to 0.70-0.73 (Config.toString, whose R2 secret the nested toString masks). Both wrong comments are fixed.
# Read --loose for this rule: the band under 0.74 holds real defects as well as sound comments.
threshold: 0.74
# Calibrated on the file axis; pinned so the scheduler cannot move it.
axis: file
severity: warning
rule:
  all:
    - any:
        - kind: function_declaration
        - kind: class_declaration
        - kind: object_declaration
        - kind: property_declaration
    - follows:
        # KDoc is a multiline_comment in this grammar.
        any:
          - kind: multiline_comment
          - kind: line_comment
        pattern: $DOC
ask: >-
  The comment above this code claims something that is not true of the code.
criteria:
  "true": >-
    A specific claim the comment makes is contradicted by the code: it names a
    different operation, direction, ordering or unit than the code uses, it
    states a return value, @throws condition or guarantee the code does not
    provide, it describes a side effect the code does not perform or omits one
    it does, it gives a count, limit or default that differs from the code's, or
    it refers to a parameter, field or function that the code no longer has.
  "false": >-
    Every specific claim the comment makes holds for the code below it. A
    comment that is vague, redundant, restates the obvious, or says less than it
    could is not a false comment -- only a claim that is actually wrong counts
    here. A section heading names the part of the file that starts here, not the
    declaration under it, and makes no claim about it.
note: >-
  Judge only claims the code in front of you can confirm or contradict. A
  comment about a caller's obligations, about performance, about history, or
  about the behaviour of a library, database or external API outside this file
  is not checkable here and is not a violation.

  /api/v1/auth/visits/{visitId}/images:
    post:
      operationId: uploadVisitImage
      description: |-
        Adds an image at the end of a visit log's images (at most 10). The server applies the EXIF orientation,
        scales the long edge down to 2048 px and stores a JPEG without metadata.
        The request's Origin must be the site's own origin, or a localhost one on an http (local development) site;
        403 otherwise.
      parameters:
        - name: visitId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitImage'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitImageBadRequestErrorBody'
        '401':

        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorBody'
        '502':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GooglePlacesFailedErrorBody'
        '503':
          description: Service unavailable.
          content:

  /api/v1/auth/google-places/autocomplete:
    get:
      operationId: googlePlacesAutocomplete
      description: Admin-only Google Places (New) autocomplete proxy. A blank query returns no suggestions.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: sessionToken
          in: query
          required: true
          description: Client-generated token grouping an autocomplete session with its details call for billing.
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,36}$
            maxLength: 36
          explode: false
        - name: lat
          in: query
          required: false
          description: With lng, biases suggestions toward this point, e.g. where a photo was taken. Ignored alone.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          explode: false
        - name: lng
          in: query
          required: false
          description: With lat, biases suggestions toward this point. Ignored alone.
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceSuggestionsResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorBody'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:

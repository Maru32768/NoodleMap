            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorBody'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/VisitImageProcessingBusyErrorBody'
                  - $ref: '#/components/schemas/VisitImagesStorageUnconfiguredErrorBody'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadVisitImageRequest'
            encoding:
              file:
                contentType: '*/*'

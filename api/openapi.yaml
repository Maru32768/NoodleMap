openapi: 3.0.0
info:
  title: NoodleMap API
  version: 0.0.0
tags: []
paths:
  /api/v1/auth/google:
    post:
      operationId: googleAuth
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthBadRequestErrorBody'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreationFailedErrorBody'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
  /api/v1/auth/google-places/autocomplete:
    get:
      operationId: googlePlacesAutocomplete
      description: Admin-only Google Places (New) autocomplete proxy. A blank query returns no suggestions.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: sessionToken
          in: query
          required: true
          description: Client-generated token grouping an autocomplete session with its details call for billing.
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,36}$
            maxLength: 36
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceSuggestionsResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorBody'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequiredErrorBody'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDeniedErrorBody'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorBody'
        '502':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GooglePlacesFailedErrorBody'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GooglePlacesNotConfiguredErrorBody'
  /api/v1/auth/google-places/details:
    get:
      operationId: googlePlacesDetails
      description: Admin-only Google Places (New) place details proxy.
      parameters:
        - name: placeId
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: sessionToken
          in: query
          required: true
          description: The token used by the autocomplete session this selection ends.
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,36}$
            maxLength: 36
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceDetails'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorBody'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequiredErrorBody'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDeniedErrorBody'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorBody'
        '502':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GooglePlacesFailedErrorBody'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GooglePlacesNotConfiguredErrorBody'
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorBody'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequiredErrorBody'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorBody'
  /api/v1/auth/me:
    get:
      operationId: me
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestErrorBody'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequiredErrorBody'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorBody'
  /api/v1/auth/shops:
    post:
      operationId: addShop
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddShopBadRequestErrorBody'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequiredErrorBody'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDeniedErrorBody'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorBody'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddShopRequest'
  /api/v1/auth/shops/{id}:
    put:
      operationId: updateShop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateShopBadRequestErrorBody'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequiredErrorBody'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDeniedErrorBody'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorBody'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShopRequest'
  /api/v1/auth/tags:
    put:
      operationId: saveTags
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagBadRequestErrorBody'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequiredErrorBody'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDeniedErrorBody'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorBody'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTagsRequest'
  /api/v1/shops:
    get:
      operationId: listShops
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopsResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorBody'
  /api/v1/tags:
    get:
      operationId: listTags
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorBody'
components:
  schemas:
    AddShopBadRequestErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - invalid_request
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/AddShopFieldError'
    AddShopField:
      type: string
      enum:
        - name
        - nameKana
        - lat
        - lng
        - postalCode
        - address
        - openedAt
        - closedAt
        - googlePlaceId
        - category
        - tagIds
    AddShopFieldError:
      type: object
      required:
        - field
        - type
      properties:
        field:
          $ref: '#/components/schemas/AddShopField'
        type:
          $ref: '#/components/schemas/FieldErrorType'
        message:
          type: string
    AddShopRequest:
      type: object
      required:
        - name
        - lat
        - lng
        - postalCode
        - address
        - googlePlaceId
        - category
        - tagIds
      properties:
        name:
          type: string
        nameKana:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        postalCode:
          type: string
        address:
          type: string
        openedAt:
          type: string
        closedAt:
          type: string
        googlePlaceId:
          type: string
        category:
          $ref: '#/components/schemas/CategorySlug'
        tagIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
    AuthResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/User'
    AuthenticationRequiredErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - authentication_required
        message:
          type: string
    CategorySlug:
      type: string
      enum:
        - ramen
        - udon
    ErrorType:
      type: string
      enum:
        - invalid_request
        - authentication_required
        - permission_denied
        - google_auth_failed
        - session_creation_failed
        - internal_error
        - google_places_not_configured
        - google_places_failed
    FieldErrorType:
      type: string
      enum:
        - required
        - invalid_format
        - out_of_range
        - too_long
        - duplicate
        - unknown
    GoogleAuthBadRequestErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - invalid_request
            - google_auth_failed
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/GoogleAuthFieldError'
    GoogleAuthField:
      type: string
      enum:
        - credential
    GoogleAuthFieldError:
      type: object
      required:
        - field
        - type
      properties:
        field:
          $ref: '#/components/schemas/GoogleAuthField'
        type:
          $ref: '#/components/schemas/FieldErrorType'
        message:
          type: string
    GoogleAuthRequest:
      type: object
      required:
        - credential
      properties:
        credential:
          type: string
    GooglePlacesFailedErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - google_places_failed
        message:
          type: string
      description: The Google Places API request failed or returned an unusable response.
    GooglePlacesNotConfiguredErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - google_places_not_configured
        message:
          type: string
      description: The server has no Google Places API key configured.
    InternalErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - internal_error
        message:
          type: string
    InvalidRequestErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - invalid_request
        message:
          type: string
    PermissionDeniedErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - permission_denied
        message:
          type: string
    PlaceDetails:
      type: object
      required:
        - placeId
        - name
        - postalCode
        - address
        - lat
        - lng
        - closed
      properties:
        placeId:
          type: string
        name:
          type: string
        postalCode:
          type: string
        address:
          type: string
          description: Formatted address without the leading country name and postal code.
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        closed:
          type: boolean
          description: True when Google reports the place as permanently closed.
    PlaceSuggestion:
      type: object
      required:
        - placeId
        - mainText
      properties:
        placeId:
          type: string
        mainText:
          type: string
        secondaryText:
          type: string
    PlaceSuggestionsResponse:
      type: object
      required:
        - suggestions
      properties:
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/PlaceSuggestion'
    SaveTagsRequest:
      type: object
      required:
        - tags
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagInput'
    SessionCreationFailedErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - session_creation_failed
        message:
          type: string
    Shop:
      type: object
      required:
        - id
        - name
        - lat
        - lng
        - postalCode
        - address
        - googlePlaceId
        - eaten
        - rate
        - favorite
        - category
        - tags
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
        nameKana:
          type: string
          description: Hiragana reading of the shop name, used for search. Absent when not set.
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        openedAt:
          type: string
          description: Opening date as an ISO 8601 calendar date (YYYY-MM-DD). Absent when unknown.
        closedAt:
          type: string
          description: Closing date as an ISO 8601 calendar date (YYYY-MM-DD). Absent when the shop is not closing.
        postalCode:
          type: string
        address:
          type: string
        googlePlaceId:
          type: string
        eaten:
          type: boolean
        rate:
          type: number
          format: double
        favorite:
          type: boolean
          description: 'Derived on the server: true when the shop is eaten and its rate is 80 or more. Read-only.'
        category:
          $ref: '#/components/schemas/CategorySlug'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    ShopsResponse:
      type: object
      required:
        - shops
      properties:
        shops:
          type: array
          items:
            $ref: '#/components/schemas/Shop'
    Tag:
      type: object
      required:
        - id
        - label
        - slug
        - color
        - sortOrder
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        category:
          $ref: '#/components/schemas/CategorySlug'
        label:
          type: string
        slug:
          type: string
        color:
          type: string
        sortOrder:
          type: integer
          format: int32
    TagBadRequestErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - invalid_request
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/TagFieldError'
    TagField:
      type: string
      enum:
        - category
        - label
        - slug
        - color
        - sortOrder
    TagFieldError:
      type: object
      required:
        - field
        - type
      properties:
        field:
          $ref: '#/components/schemas/TagField'
        type:
          $ref: '#/components/schemas/FieldErrorType'
        message:
          type: string
    TagInput:
      type: object
      required:
        - label
        - slug
        - color
        - sortOrder
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        category:
          $ref: '#/components/schemas/CategorySlug'
        label:
          type: string
        slug:
          type: string
        color:
          type: string
        sortOrder:
          type: integer
          format: int32
    TagsResponse:
      type: object
      required:
        - tags
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    UpdateShopBadRequestErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - invalid_request
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/UpdateShopFieldError'
    UpdateShopField:
      type: string
      enum:
        - name
        - nameKana
        - lat
        - lng
        - postalCode
        - address
        - openedAt
        - closedAt
        - googlePlaceId
        - category
        - eaten
        - rate
        - tagIds
    UpdateShopFieldError:
      type: object
      required:
        - field
        - type
      properties:
        field:
          $ref: '#/components/schemas/UpdateShopField'
        type:
          $ref: '#/components/schemas/FieldErrorType'
        message:
          type: string
    UpdateShopRequest:
      type: object
      required:
        - name
        - lat
        - lng
        - postalCode
        - address
        - googlePlaceId
        - category
        - eaten
        - rate
        - tagIds
      properties:
        name:
          type: string
        nameKana:
          type: string
          description: Omit to keep the stored reading (older clients); a blank string clears it.
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        postalCode:
          type: string
        address:
          type: string
        openedAt:
          type: string
        closedAt:
          type: string
        googlePlaceId:
          type: string
        category:
          $ref: '#/components/schemas/CategorySlug'
        eaten:
          type: boolean
        rate:
          type: number
          format: double
        tagIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
    User:
      type: object
      required:
        - id
        - email
        - isAdmin
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        email:
          type: string
        isAdmin:
          type: boolean
    uuid:
      type: string
      description: UUID serialized as a string.
servers:
  - url: /
    description: Current origin
    variables: {}

                $ref: '#/components/schemas/NotFoundErrorBody'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitImageLimitReachedErrorBody'
        '500':
          description: Server error

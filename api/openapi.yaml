              schema:
                $ref: '#/components/schemas/InternalErrorBody'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/MealRecordImageProcessingBusyErrorBody'
                  - $ref: '#/components/schemas/MealRecordImagesStorageUnconfiguredErrorBody'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadMealRecordImageRequest'
            encoding:
              file:
                contentType: '*/*'

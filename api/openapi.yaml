          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitImagesResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitImageBadRequestErrorBody'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRequiredErrorBody'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDeniedErrorBody'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorBody'
        '408':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestBodyTimeoutErrorBody'
        '413':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestBodyTooLargeErrorBody'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorBody'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestBodyBusyErrorBody'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderVisitImagesRequest'
  /api/v1/shops:
    get:
      operationId: listShops
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopsResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorBody'
  /api/v1/shops/{id}/visits:
    get:
      operationId: listVisitLogs
      description: A shop's visit logs, newest first. privateNote is included only for the admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitLogsResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorBody'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorBody'
  /api/v1/tags:
    get:
      operationId: listTags
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorBody'
components:
  schemas:
    AddShopBadRequestErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - invalid_request
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/AddShopFieldError'
    AddShopField:
      type: string
      enum:
        - name
        - nameKana
        - lat
        - lng
        - postalCode
        - address
        - openedAt
        - closedAt
        - googlePlaceId
        - category
        - tagIds
        - links
        - wishLevel
    AddShopFieldError:
      type: object
      required:
        - field
        - type
      properties:
        field:
          $ref: '#/components/schemas/AddShopField'
        type:
          $ref: '#/components/schemas/FieldErrorType'
        message:
          type: string
    AddShopRequest:
      type: object
      required:
        - name
        - lat
        - lng
        - postalCode
        - address
        - category
        - tagIds
      properties:
        name:
          type: string
        nameKana:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        postalCode:
          type: string
        address:
          type: string
        openedAt:
          type: string
        closedAt:
          type: string
        googlePlaceId:
          type: string
          description: Omit (or send a blank string) for a shop entered by hand. Must be unique among shops when set.
        category:
          $ref: '#/components/schemas/CategorySlug'
        tagIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
        wishLevel:
          allOf:
            - $ref: '#/components/schemas/WishLevel'
          description: Omit when not set.
        links:
          type: array
          items:
            $ref: '#/components/schemas/ShopLinkInput'
          maxItems: 10
          description: At most 10 links, stored in array order. Omit for none.
    AuthResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/User'
    AuthSession:
      type: object
      required:
        - id
        - createdAt
        - lastUsedAt
        - current
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        userAgent:
          type: string
        createdAt:
          type: string
          description: Login time, ISO 8601 UTC.
        lastUsedAt:
          type: string
          description: Approximate last use (expiry minus TTL; the expiry slides at most every 12 hours), ISO 8601 UTC.
        current:
          type: boolean
          description: True for the session that made this request.
      description: A signed-in session (device) of the current user. `id` is not the session token.
    AuthenticationRequiredErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - authentication_required
        message:
          type: string
    BackupBusyErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - backup_busy
        message:
          type: string
    CategorySlug:
      type: string
      enum:
        - ramen
        - udon
    ErrorType:
      type: string
      enum:
        - request_body_too_large
        - request_body_busy
        - request_body_timeout
        - backup_busy
        - invalid_request
        - authentication_required
        - permission_denied
        - google_auth_failed
        - session_creation_failed
        - not_found
        - internal_error
        - google_places_not_configured
        - google_places_failed
        - shop_has_visit_logs
        - visit_image_limit_reached
        - visit_image_processing_busy
        - visit_images_storage_unconfigured
    FieldErrorType:
      type: string
      enum:
        - required
        - invalid_format
        - out_of_range
        - too_long
        - duplicate
        - unknown
    GoogleAuthBadRequestErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - invalid_request
            - google_auth_failed
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/GoogleAuthFieldError'
    GoogleAuthField:
      type: string
      enum:
        - credential
    GoogleAuthFieldError:
      type: object
      required:
        - field
        - type
      properties:
        field:
          $ref: '#/components/schemas/GoogleAuthField'
        type:
          $ref: '#/components/schemas/FieldErrorType'
        message:
          type: string
    GoogleAuthRequest:
      type: object
      required:
        - credential
      properties:
        credential:
          type: string
    GooglePlacesFailedErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - google_places_failed
        message:
          type: string
      description: The Google Places API request failed or returned an unusable response.
    GooglePlacesNotConfiguredErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - google_places_not_configured
        message:
          type: string
      description: The server has no Google Places API key configured.
    InternalErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - internal_error
        message:
          type: string
    InvalidRequestErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - invalid_request
        message:
          type: string
    MenuItem:
      type: object
      required:
        - name
        - isLimited
      properties:
        name:
          type: string
        isLimited:
          type: boolean
          description: True for a 限定メニュー.
        price:
          type: integer
          format: int32
          description: Price in yen. Absent when not recorded.
      description: One 食べたメニュー of a visit log.
    MenuItemInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 200
        isLimited:
          type: boolean
          description: True for a 限定メニュー. Omit for false.
        price:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000000
          description: Price in yen, 0 to 10,000,000. Omit when not recorded.
      description: One 食べたメニュー as written by the admin. The name is trimmed and must not be blank.
    NotFoundErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - not_found
        message:
          type: string
    PermissionDeniedErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - permission_denied
        message:
          type: string
    PlaceDetails:
      type: object
      required:
        - placeId
        - name
        - postalCode
        - address
        - lat
        - lng
        - closed
      properties:
        placeId:
          type: string
        name:
          type: string
        postalCode:
          type: string
        address:
          type: string
          description: Formatted address without the leading country name and postal code.
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        closed:
          type: boolean
          description: True when Google reports the place as permanently closed.
    PlaceSuggestion:
      type: object
      required:
        - placeId
        - mainText
      properties:
        placeId:
          type: string
        mainText:
          type: string
        secondaryText:
          type: string
    PlaceSuggestionsResponse:
      type: object
      required:
        - suggestions
      properties:
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/PlaceSuggestion'
    ReorderVisitImagesRequest:
      type: object
      required:
        - imageIds
      properties:
        imageIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
          maxItems: 10
      description: Every image id of the visit log exactly once, in the new display order.
    RequestBodyBusyErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - request_body_busy
        message:
          type: string
    RequestBodyTimeoutErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - request_body_timeout
        message:
          type: string
    RequestBodyTooLargeErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - request_body_too_large
        message:
          type: string
    SaveTagsRequest:
      type: object
      required:
        - tags
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagInput'
    SessionCreationFailedErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - session_creation_failed
        message:
          type: string
    SessionsResponse:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AuthSession'
    Shop:
      type: object
      required:
        - id
        - name
        - lat
        - lng
        - postalCode
        - address
        - eaten
        - rate
        - favorite
        - visitCount
        - category
        - tags
        - links
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
        nameKana:
          type: string
          description: Hiragana reading of the shop name, used for search. Absent when not set.
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        openedAt:
          type: string
          description: Opening date as an ISO 8601 calendar date (YYYY-MM-DD). Absent when unknown.
        closedAt:
          type: string
          description: Closing date as an ISO 8601 calendar date (YYYY-MM-DD). Absent when the shop is not closing.
        postalCode:
          type: string
        address:
          type: string
        googlePlaceId:
          type: string
          description: Google Places place id. Absent when the shop was entered by hand.
        eaten:
          type: boolean
          description: 'Derived on the server: true when the shop has at least one visit log. Read-only.'
        rate:
          type: number
          format: double
          description: 'Derived on the server: the rate of the latest visit log that has one, or 0 when none has. Read-only.'
        favorite:
          type: boolean
          description: "Derived on the server: true when the shop's rate comes from a visit log and is 80 or more. Read-only."
        visitCount:
          type: integer
          format: int32
          description: Number of visit logs of the shop. Read-only.
        wishLevel:
          allOf:
            - $ref: '#/components/schemas/WishLevel'
          description: 気になる度. Absent when not set. Kept after the shop is eaten, but only meaningful before.
        category:
          $ref: '#/components/schemas/CategorySlug'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        links:
          type: array
          items:
            $ref: '#/components/schemas/ShopLink'
          description: External links (official site, SNS, ...) in display order.
        coverPhotoUrl:
          type: string
          description: 'Derived on the server: URL of the first image of the latest visit log that has images. Absent when none has.'
    ShopHasVisitLogsErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - shop_has_visit_logs
        message:
          type: string
      description: The shop has visit logs, so it cannot be deleted.
    ShopLink:
      type: object
      required:
        - type
        - url
      properties:
        type:
          $ref: '#/components/schemas/ShopLinkType'
        label:
          type: string
          description: Display text. Absent when not set; clients fall back to the type name.
        url:
          type: string
    ShopLinkInput:
      type: object
      required:
        - type
        - url
      properties:
        type:
          $ref: '#/components/schemas/ShopLinkType'
        label:
          type: string
          maxLength: 100
        url:
          type: string
          maxLength: 2048
      description: An http(s) URL of at most 2048 characters with an optional label of at most 100 characters.
    ShopLinkType:
      type: string
      enum:
        - official
        - twitter
        - instagram
        - facebook
        - tabelog
        - other
    ShopsResponse:
      type: object
      required:
        - shops
      properties:
        shops:
          type: array
          items:
            $ref: '#/components/schemas/Shop'
    Tag:
      type: object
      required:
        - id
        - label
        - slug
        - color
        - sortOrder
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        category:
          $ref: '#/components/schemas/CategorySlug'
        label:
          type: string
        slug:
          type: string
        color:
          type: string
        sortOrder:
          type: integer
          format: int32
    TagBadRequestErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - invalid_request
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/TagFieldError'
    TagField:
      type: string
      enum:
        - category
        - label
        - slug
        - color
        - sortOrder
    TagFieldError:
      type: object
      required:
        - field
        - type
      properties:
        field:
          $ref: '#/components/schemas/TagField'
        type:
          $ref: '#/components/schemas/FieldErrorType'
        message:
          type: string
    TagInput:
      type: object
      required:
        - label
        - slug
        - color
        - sortOrder
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        category:
          $ref: '#/components/schemas/CategorySlug'
        label:
          type: string
        slug:
          type: string
        color:
          type: string
        sortOrder:
          type: integer
          format: int32
    TagsResponse:
      type: object
      required:
        - tags
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    UpdateShopBadRequestErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - invalid_request
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/UpdateShopFieldError'
    UpdateShopField:
      type: string
      enum:
        - name
        - nameKana
        - lat
        - lng
        - postalCode
        - address
        - openedAt
        - closedAt
        - googlePlaceId
        - category
        - eaten
        - rate
        - tagIds
        - links
        - wishLevel
    UpdateShopFieldError:
      type: object
      required:
        - field
        - type
      properties:
        field:
          $ref: '#/components/schemas/UpdateShopField'
        type:
          $ref: '#/components/schemas/FieldErrorType'
        message:
          type: string
    UpdateShopRequest:
      type: object
      required:
        - name
        - lat
        - lng
        - postalCode
        - address
        - category
        - tagIds
      properties:
        name:
          type: string
        nameKana:
          type: string
          description: Omit to keep the stored reading (older clients); a blank string clears it.
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        postalCode:
          type: string
        address:
          type: string
        openedAt:
          type: string
        closedAt:
          type: string
        googlePlaceId:
          type: string
          description: Omit to keep the stored place id (older clients); a blank string clears it.
        category:
          $ref: '#/components/schemas/CategorySlug'
        eaten:
          type: boolean
          description: 'Deprecated and ignored by the server: 食べた is derived from visit logs. Older clients still send it.'
        rate:
          type: number
          format: double
          description: "Deprecated and ignored by the server: the shop's rate is derived from visit logs. Older clients still send it."
        tagIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
        wishLevel:
          anyOf:
            - $ref: '#/components/schemas/WishLevel'
            - type: string
              enum:
                - ''
          description: Omit to keep the stored 気になる度 (older clients); an empty string clears it.
        links:
          type: array
          items:
            $ref: '#/components/schemas/ShopLinkInput'
          maxItems: 10
          description: Omit to keep the stored links (older clients); an array replaces them all, in array order. At most 10.
    UpdateVisitImageRequest:
      type: object
      properties:
        caption:
          type: string
          maxLength: 100
      description: Trimmed; blank or omitted clears the caption.
    UploadVisitImageRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
        - file
    User:
      type: object
      required:
        - id
        - email
        - isAdmin
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        email:
          type: string
        isAdmin:
          type: boolean
    VisitImage:
      type: object
      required:
        - id
        - url
        - width
        - height
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        url:
          type: string
          description: Absolute URL of the JPEG.
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        caption:
          type: string
      description: 'One 訪問画像: a JPEG whose long edge is at most 2048 px, already rotated upright.'
    VisitImageBadRequestErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - invalid_request
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/VisitImageFieldError'
    VisitImageField:
      type: string
      enum:
        - file
        - caption
        - imageIds
      description: '`file` is the uploaded image part; `imageIds` is the full ordered id list of a reorder.'
    VisitImageFieldError:
      type: object
      required:
        - field
        - type
      properties:
        field:
          $ref: '#/components/schemas/VisitImageField'
        type:
          $ref: '#/components/schemas/FieldErrorType'
        message:
          type: string
    VisitImageLimitReachedErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - visit_image_limit_reached
        message:
          type: string
      description: The visit log already has the maximum number of images (10).
    VisitImageProcessingBusyErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - visit_image_processing_busy
        message:
          type: string
      description: Too many images are being processed right now; retry shortly.
    VisitImagesResponse:
      type: object
      required:
        - images
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/VisitImage'
    VisitImagesStorageUnconfiguredErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - visit_images_storage_unconfigured
        message:
          type: string
      description: The server has no storage for visit images configured.
    VisitLog:
      type: object
      required:
        - id
        - menuItems
        - images
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        visitedOn:
          type: string
          description: Visit date as an ISO 8601 calendar date (YYYY-MM-DD). Absent when unknown.
        menuItems:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
          description: 食べたメニュー in display order.
        totalPrice:
          type: integer
          format: int32
          description: 'Derived on the server: the sum of the menu item prices. Absent when no item has a price.'
        rate:
          type: number
          format: double
          description: 0 to 100. Absent when the visit is not rated.
        eventName:
          type: string
          description: 催事 (department store fair, ramen festival, ...) where the shop was visited.
        publicNote:
          type: string
        privateNote:
          type: string
          description: Only in responses to the admin; omitted for everyone else.
        images:
          type: array
          items:
            $ref: '#/components/schemas/VisitImage'
          description: The visit's images in display order; the first one represents the visit.
      description: 'One 訪問ログ. Visit logs are listed newest first: by visitedOn, those without one last, then by creation.'
    VisitLogBadRequestErrorBody:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - invalid_request
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/VisitLogFieldError'
    VisitLogField:
      type: string
      enum:
        - visitedOn
        - menuItems
        - rate
        - eventName
        - publicNote
        - privateNote
      description: '`menuItems` covers the list and each item; the message names the item (`menuItems[0].name`).'
    VisitLogFieldError:
      type: object
      required:
        - field
        - type
      properties:
        field:
          $ref: '#/components/schemas/VisitLogField'
        type:
          $ref: '#/components/schemas/FieldErrorType'
        message:
          type: string
    VisitLogInput:
      type: object
      properties:
        visitedOn:
          type: string
          description: ISO 8601 calendar date (YYYY-MM-DD), no later than tomorrow. Omit when unknown.
        menuItems:
          type: array
          items:
            $ref: '#/components/schemas/MenuItemInput'
          maxItems: 10
          description: 食べたメニュー in display order, at most 10. Omit for none.
        rate:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: 0 to 100. Omit when not rated.
        eventName:
          type: string
          maxLength: 100
        publicNote:
          type: string
          maxLength: 2000
        privateNote:
          type: string
          maxLength: 2000
      description: |-
        A visit log as written by the admin. Strings are trimmed and a blank string means not set.
        On update every field is replaced, so an omitted field is cleared.
    VisitLogsResponse:
      type: object
      required:
        - visits
      properties:
        visits:
          type: array
          items:
            $ref: '#/components/schemas/VisitLog'
    WishLevel:
      type: string
      enum:
        - low
        - medium
        - high
      description: '気になる度 of a shop not eaten yet: low = ちょっと気になる, medium = 気になる, high = 絶対行きたい.'
    uuid:
      type: string
      description: UUID serialized as a string.

[tools]
node = "24"
terraform = "1.15.5"
# mise skips install scripts by default, and @ast-grep/cli puts its binary in place with one.
"npm:jev-lint" = { version = "0.7.0", allow_builds = ["@ast-grep/cli"] }

[env]
AWS_REQUEST_CHECKSUM_CALCULATION = "when_required"
AWS_RESPONSE_CHECKSUM_VALIDATION = "when_required"
_.file = ".env"

# Without a base, the review covers what is not pushed yet. On a branch, pass the ref it started from:
# mise run jev-review master
[tasks.jev-review]
description = "Judge the lines changed since a base ref (origin/master by default) with jev-lint"
usage = 'arg "[base]" help="The ref to review the changes since" default="origin/master"'
run = "jev-lint review --base {{usage.base}}"

# Ctrl+C stops both. Open http://localhost:5173; Vite proxies /api and /r/ to the server.
[tasks.dev]
description = "Start the API server and the Vite dev server together"
depends = ["dev:server", "dev:web"]

[tasks."dev:server"]
description = "Start the API server on SERVER_PORT against db-data/noodle_map.db"
dir = "{{config_root}}/server"
# The same database docker compose mounts; the server does not create a missing parent directory.
env = { DB_PATH = "{{config_root}}/db-data/noodle_map.db" }
run = "./gradlew run"
run_windows = '.\gradlew.bat run'

[tasks."dev:web"]
description = "Start the Vite dev server"
dir = "{{config_root}}/web"
run = "npm run dev"

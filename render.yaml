
services:
  - type: web
    name: noodle-map-backend
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    branch: master
    region: oregon
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    pullRequestPreviewsEnabled: false
    disk:
      name: noodle-map-data
      mountPath: /work/db-data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /work/db-data/noodle_map.db
      - key: SERVER_PORT
        value: "80"
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: AUTH_COOKIE_SECURE
        value: "true"
      # Set the shared credentials before deploying this R2-enabled configuration.
      # Scope the app token to the three app buckets; keep Terraform state credentials separate.
      - key: R2_ENDPOINT
        value: https://27f0188849b71a6222f1aa078299a54a.r2.cloudflarestorage.com
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Private database backups. No public bucket/domain.
      - key: BACKUP_R2_BUCKET
        value: noodle-map-backups
      - key: BACKUP_R2_PREFIX
        value: db-backup
      - key: PUBLIC_BASE_URL
        value: https://noodle-map.marulabs.dev
      # OGP image cache (terraform/modules/cloudflare-r2-og-images).
      - key: OG_R2_BUCKET
        value: noodle-map-og-images
      - key: OG_R2_PUBLIC_BASE_URL
        value: https://og.noodle-map.marulabs.dev
      # 訪問画像 storage (terraform/modules/cloudflare-r2-visit-images).
      - key: VISIT_IMAGES_R2_BUCKET
        value: noodle-map-visit-images
      - key: VISIT_IMAGES_R2_PUBLIC_BASE_URL
        value: https://images.noodle-map.marulabs.dev

  - type: web
    runtime: static
    name: noodle-map-front
    rootDir: web
    buildCommand: npm run build
    staticPublishPath: build/client
    branch: master
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    domains:
      - noodle-map.marulab.jp
      - noodle-map.marulabs.dev
    headers:
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /admin
        name: Cache-Control
        value: no-cache
      - path: /admin/*
        name: Cache-Control
        value: no-cache
      - path: /admin/index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /admin-manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /maps/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /api/*
        destination: https://noodle-map-backend.onrender.com/api/*
      # Share pages with OGP meta; must stay above the SPA catch-all.
      - type: rewrite
        source: /r/*
        destination: https://noodle-map-backend.onrender.com/r/*
      - type: rewrite
        source: /admin
        destination: /admin/index.html
      - type: rewrite
        source: /admin/*
        destination: /admin/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Render static sites don't read .mise.toml; keep in step with it.
      - key: NODE_VERSION
        value: "24"
      - key: VITE_GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: VITE_BASEMAP_PMTILES_URL
        value: https://tiles.noodle-map.marulabs.dev/maps/japan-light-20251201-v1.pmtiles
